
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Kelompok 5 - Minggu 2</title>

    <!-- Library A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Library AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- Scene Augmented Reality -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;"
    >

        <!-- Pencahayaan -->
        <a-light
            type="ambient"
            color="#ffffff"
            intensity="0.6">
        </a-light>

        <a-light
            type="directional"
            color="#ffffff"
            intensity="0.8"
            position="1 3 2">
        </a-light>

        <!-- Marker Hiro -->
        <a-marker preset="hiro">

            <!-- Alas atau bidang dasar -->
            <a-plane
                position="0 0 0"
                rotation="-90 0 0"
                width="2"
                height="2"
                color="#E9E5FA"
                opacity="0.7"
                transparent="true">
            </a-plane>

            <!-- Objek 1: Kubus Biru -->
            <a-box
                position="-0.6 0.25 0"
                width="0.5"
                height="0.5"
                depth="0.5"
                color="#4C6EF5">
            </a-box>

            <!-- Objek 2: Bola Oranye -->
            <a-sphere
                position="0 0.3 0"
                radius="0.3"
                color="#D9531E"
                material="metalness: 0.3; roughness: 0.4;">
            </a-sphere>

            <!-- Objek 3: Silinder Hijau Berputar -->
            <a-cylinder
                position="0.6 0.3 0"
                radius="0.2"
                height="0.6"
                color="#0B7F73"
                animation="
                    property: rotation;
                    to: 0 360 0;
                    dur: 4000;
                    loop: true;
                    easing: linear;
                ">
            </a-cylinder>

            <!-- Objek 4: Kubus Bertekstur -->
            <a-box
                position="0 0.15 0.7"
                width="0.5"
                height="0.3"
                depth="0.5"
                src="assets/tekstur.jpg">
            </a-box>

        </a-marker>

        <!-- Kamera AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
